# Écran virtuel Xorg « dummy » pour tester LMD sans toucher au bureau (voir tools/lmd-virtual.sh).
# Contrairement à Xvfb, il annonce des modes à 60 Hz (DXVK plante sur une fréquence nulle).
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AllowMouseOpenFail" "true"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
EndSection

Section "Device"
    Identifier "dummy"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Monitor"
    Identifier "monitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    # 1024x768 à 60 Hz
    Modeline "1024x768_60" 63.50 1024 1072 1176 1328 768 771 775 798 -hsync +vsync
EndSection

Section "Screen"
    Identifier "screen"
    Device "dummy"
    Monitor "monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1024x768_60"
    EndSubSection
EndSection
